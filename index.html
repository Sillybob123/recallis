    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#002871" />
    <meta
      name="description"
      content="Recallis — flashcards, cloze deletion, image occlusion, and lecture notes built for medical school."

    <link rel="canonical" href="https://recallis.org/" />

    <!--
      The link preview. iMessage, WhatsApp, Slack, Discord and Twitter all
      read these when the URL is pasted; without them a shared link is a bare
      blue string. Absolute URLs are required — a crawler has no page context
      to resolve a relative one against. The ?v= on the image is how you get
      a cached preview to refresh after the artwork changes.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Recallis" />
    <meta property="og:url" content="https://recallis.org/" />
    <meta property="og:title" content="Recallis — everything you study, in one place" />
    <meta
      property="og:description"
      content="Spaced repetition, cloze deletion and image occlusion, lecture notes, and a planner built from your own timetable. Made for medical school."
    />
    <meta property="og:image" content="https://recallis.org/og-card.png?v=1" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Recallis — spaced repetition, image occlusion, lecture notes and an academic planner."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Recallis — everything you study, in one place" />
    <meta
      name="twitter:description"
      content="Spaced repetition, cloze deletion and image occlusion, lecture notes, and a planner built from your own timetable."
    />
    <meta name="twitter:image" content="https://recallis.org/og-card.png?v=1" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Recallis — Flashcards, Cloze & Image Occlusion</title>
